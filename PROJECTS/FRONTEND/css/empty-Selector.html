<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empty Selector</title>
</head>
<style>
    p {
        color: red;
    }

    p:empty {
        display: none;
    }
</style>

<body>
    <p>This is visible</p>
    <p></p>
    <p> </p>
    <p><span></span></p>
</body>

</html>
