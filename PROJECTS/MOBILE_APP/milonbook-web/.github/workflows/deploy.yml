name: Deploy Milonbook Backend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js 20
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      # 3️⃣ Install dependencies & build on GitHub
      - name: Install dependencies and build
        run: |
          npm install --legacy-peer-deps
          npm run build   # Creates the .next folder

      # 4️⃣ Setup SSH using Secrets
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config

      # 5️⃣ Sync project files to EC2
      - name: Sync files to EC2
        run: |
          rsync -avz --delete --exclude=.env --exclude=.git ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/milonbook-web/
          rsync -avz --delete node_modules/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/milonbook-web/node_modules/
          rsync -avz --delete .next/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/milonbook-web/.next/
          # Sync production environment variables
          rsync -avz .env ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/milonbook-web/.env

      # 6️⃣ Start/Restart PM2 on EC2
      - name: Start/Restart PM2 on EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            cd /var/www/milonbook-web &&
            if pm2 describe milonbook > /dev/null; then
              pm2 restart milonbook
            else
              pm2 start npm --name milonbook -- run start
            fi
            pm2 save
          "
